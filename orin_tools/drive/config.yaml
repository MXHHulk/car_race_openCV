# 新版循線程式（2026-11-17 重寫）。只看「現在」鏡頭和 IMU 看到的東西，不記賽道、不記起點：
# 放在賽道任何位置都能出發。五個行為：
#   1. 進彎減速        speed.v_curve / v_sat，前方車道彎了就先降（preview）
#   2. 看到大直線加速  兩條線都看得到、看得遠又直 → speed.v_straight
#   3. 上坡提速        IMU 俯仰 ≥ slope.up_pitch → slope.up_v，卡住再加推力
#   4. 遇見虛線左轉    前方出現橫越的虛線（平地上）→ junction 左轉
#   5. 下坡反打後輪    IMU 俯仰 ≤ −slope.down_pitch → 一路反打後輪（越快打越多）、太慢推

camera:
  device: 0
  width: 640
  height: 480
  fps: 30
  v4l2_ctrls:
    white_balance_automatic: 1
    auto_exposure: 1
    focus_automatic_continuous: 0
    brightness: 0
    contrast: 1
    saturation: 64
    hue: 0
    gamma: 215
    power_line_frequency: 1
    sharpness: 2
    backlight_compensation: 0
    exposure_time_absolute: 166
    focus_absolute: 0

geometry:
  calib: calib.json       # tools/calibrate.py 產生：地平線列、畫面中心（鏡頭角度一動就重跑）
  cam_height: 0.15        # 鏡頭離地（m）
  hfov: 70.0              # 水平視角（度）
  cam_to_axle: 0.12       # 鏡頭在後輪軸前方（m）
  wheelbase: 0.28
  lane_width: 0.54        # 兩條白線中心距（m）

vision:
  work_w: 320             # 辨識用解析度
  work_h: 240
  roi_gap: 6              # ROI 上緣 = 地平線下面幾列（320×240）
  roi_bottom: 0.70        # ROI 下緣（畫面高度比例）：再下面是透明前板
  min_thr: 110            # 白線門檻下限（Otsu 算出來低於這個就用這個）
  dark_min_thr: 55        # 暗處（隧道）的下限：門檻下限 = min(min_thr, max(這個, 2.2 × 畫面中位數))
  max_thr: 200
  sat_max: 24             # 白線的顏色飽和度上限：米色木板 29–38、白線 3–16（180923 坡道）
  sat_gray: 120           # 灰階超過這個的像素才看飽和度（隧道裡暗的白線顏色雜訊大）
  min_rows: 10            # 車道線元件至少跨幾列
  min_len: 0.25           # 或地面上至少多長（m）
  max_line_w: 1.5         # 地面上平均寬度超過這個（m）= 牆、柱子、白板，不當車道線（平地車道線約 0.05；
                          # 坡道上過曝 + 坡度變化會量到 0.3–1.06：0.20 時 155704 坡道真線被濾掉、坡道方向估錯 23°；202536 牆 2.1–13）
  max_range: 2.5          # 只用多遠以內的點（m）
  fork_widen: 1.15        # 岔路前（照地圖已知要走哪邊、還沒看到 V）路面寬到路寬 × 這個時，只貼要走那側的外側線
  near_max: 1.0           # 車道線最近一點要在這麼近以內（遠處別段賽道的線不要）
  near_max_slope: 0.5     # 坡上 / 坡頂：線的起點要在這麼近以內（坡頂後面的柱子起點 0.5–0.9 m）
  side_band: 0.08         # 只剩一條線：最近一點在車子左右 8 cm 以外就直接照左右分（沒有追蹤時）
  under_band: 0.08        # 只剩一條線、又在車子正下方（左右 8 cm 內）：看它往哪邊彎出去分左右線（0.15 → 0.08）
  under_deg: 15           #    線的方向偏超過幾度才這樣判斷（8 → 15：210415 坡上偏 3–7° 就誤判成右線）
  track_n: 15             # 只剩一條線：0.5 s 內看過的左 / 右線、位置差 track_dy 以內就當同一條
  track_dy: 0.15
  kink_deg: 50            # 線在 ±kink_win m 內轉超過這麼多度 = 岔路的轉角，只留近的那段（直走）
  kink_win: 0.08
  v_min_rows: 14          # 倒 V 分隔線至少幾列高（320×240）
  v_dy: 6                 # 尖端往下幾列看是不是分成左右兩段
  v_gap: 4                # 兩段至少分開幾欄
  v_far_max: 5.0          # V 在地面上最遠幾 m（真的 ≤ 4.1；164610 平台上看到下層賽道的線延伸到 7.27 被當成 V）
  v_open_deg: 15          # V 兩臂在地面上至少張開幾度（真的 26–31°；誤判的 2–7°）
  dark: 40                # ROI 平均亮度低於這個 = 暗處（隧道）
  far_dark: 44            # ROI 遠處（上 1/3）平均亮度低於這個 = 隧道口（快進暗處），先降到 v_dark
  dark_n: 3
  bright_ref_nom: 60      # 暗處 / 隧道口門檻（dark、far_dark、tunnel_far_max、tunnel_drop）是在這個場地亮度下定的；
                          #   最近 bright_ref_n 張亮度 75 百分位低於這個就按比例降門檻（11-23 早上場地中位 45、昨晚 65，
                          #   一般彎道被判成隧道口，第一個右彎沒轉：105609 / 105632）。0 = 不調整
  bright_ref_n: 180       #   取最近幾張（約 6 s）
  bright_k_min: 0.5       #   門檻最多降到原本的幾倍
  dash_top: 40            # 虛線找的範圍：地平線下 40–300 列（640×480）（60 → 40：約 1.2 m → 1.8 m，提早確認虛線）
  dash_bottom: 300
  dash_thr: 110           # 虛線亮度門檻（150 → 110：11-22 190113 / 190206 遠處 1.2–1.6 m 的虛線又暗又糊被濾掉，0.65–0.82 m 才看到，左轉晚；110 時 1.5–1.6 m 就看到、0.93–1.00 m 確認）
  dash_max_m: 0.16        # 一塊虛線在地面上最寬幾 m（0.25 → 0.16：11-21 真的虛線 ≤ 0.12，電池 / 紙張誤判的 0.20–0.23）
  dash_max_len: 0.35      # 一塊虛線沿車頭方向最長幾 m（真的 ≤ 0.31，誤判的 0.33–0.55）
  dash_sat_max: 16        # 一塊虛線的顏色飽和度上限（白膠帶 5–13；電池標籤、雜物 15–32）
  dash_ring_max: 125      # 一塊虛線周圍一圈的亮度中位數上限（黑地墊 53–118；紙張、雜物旁邊 117–149）
  dash_tol: 0.05          # 排成一直線：離線 5 cm 以內
  pair_min_len: 0.3       # 配成一對的兩條線都要至少這麼長（m）：虛線塊不能配對
  pair_down_strict: true  # 下坡 / 坡底也用 pair_min_rel（只有上坡 / 坡頂放寬到 0.6）：11-23 110643 兩次坡底配錯 0.30–0.33 m
  pair_min_rel: 0.75      # 平地（不在坡上）兩條線的路寬至少 這個 × 路寬（0.6 → 0.75：221554 三次坡底配錯的一對只有 0.31–0.35 m；
                          #   全部紀錄兩條線 < 0.375 m 只有 1%，大多在坡上，坡上維持 0.6）
  dashline_n: 3           # 沿著行進方向排成一直線的虛線塊：至少幾塊才串成一條車道線
  dashline_deg: 35        #    方向和車頭差幾度以內
  dashline_tol: 0.06      #    離那條直線幾 m 以內
  dashline_gap: 0.6       #    塊和塊之間最多幾 m
  post_turn_deg: 45       # 虛線左轉剛結束時，斜超過這個（度）的線不當車道線
  dash_gap_rel: 60        # 虛線塊之間（連線上）的亮度中位數最多比整個範圍亮這麼多（真的虛線 +3~+37 = 黑地墊；實線上的反光點 +97~+103）
  dash_cross_deg: 30      # 這條線和車頭方向夾角至少幾度（橫越前方）（45 → 30：11-21 155804 從彎道斜著接近，虛線只有 25–45°，一直被擋掉）
  dash_keep: 0.15         # 虛線左轉完：車子中心在虛線左邊這麼多 m（緊貼虛線左側，203112 走到左邊車道開出平台）

steer:
  ld: 0.45                # Pure Pursuit 前視（m，從後輪軸算）
  ld_per_v: 0.4           # 每 100% 速度多看幾 m
  ld_straight: 0.35       # 直線（彎的程度 ≤ sev_low）再多看幾 m：不蛇行；彎道不加，免得跑寬
  ld_dark: 0.35           # 暗處前視
  fwa_trim: 0             # 前輪置中修正（度，正 = 往右）；11-21 舵盤重裝後用 tools/servo_center.py 調到打直 = 0（紀錄在 logs/servo_center_log.csv）
  trim_ki: 0.3            # 平地直線自動修正置中角：每秒調「要修的角度 × 這個」度
  trim_max: 4             #    最多調幾度
  diff_trim0: 0.0         # 平地後輪差速補償初始值（0.06 → 0：11-19 是為了往右拉加的；11-21 舵盤重裝後兩輪同速直走反而往左 1–2°/s，
                          #   再加右輪多推會一直往左帶，163926 直線上前輪 60% 時間往右打在抵抗它）
  diff_trim_ki: 0.004     #    直線上每秒調「要修的角度 × 這個」
  diff_trim_max: 0.15
  fwa_limit: 44
  steer_k_right: 1.6      # 舵機左右補償：往右的偏轉量乘這個（11-21 舵盤重裝後地上實測 ±25°、35%，兩次：左 20/21°/s、右 14/12°/s → 右補到跟左一樣）
  steer_k_from: 10        #    從置中算 ±這麼多度以內不放大（直線小修正左右對稱），超過的部分才乘 k（163926 直線蛇行）
  steer_k_left: 1.0       #    往左的偏轉量乘這個（用 hw_check.py --ground 驗證、--raw 量原始）
  gain: 1.0
  k_head: 0.5             # 前輪角 = (1 − k_head)·Pure Pursuit + k_head·(車道方向 + 偏移修正)
  k_off_straight: 1.0     # 直線 / 緩彎（彎的程度 < speed.sev_high）轉向用的偏移修正（速度判斷照舊用 k_off；地圖 curve_v、guard 區段不用）（11-23 193042 直線蛇行 ±10–13 cm、週期 2.7 s；模擬 1.4 → 1.0 過衝約減半）
  k_off: 1.4              # 偏移修正：atan(k_off·偏移 / 速度)（1.0 → 2.0 → 1.4：2.0 時 191431 直線蛇行 ±15 cm、週期 2.4 s，撞起點柱子）
  smooth: 0.3             # 前輪低通（0 = 不平滑）（0.5 → 0.3：平滑也是延遲，延遲大會蛇行）
  jump_deg: 18            # 車道方向和陀螺儀推算的差超過這個（度）= 這張看錯，維持上一個前輪角
  jump_consist_n: 3       # 平地：連續這麼多張「看錯」方向彼此一致（差 ≤ jump_consist_deg）就接受（11-23 120220 右緩彎出口
  jump_consist_deg: 6     #   彎道收緊 −24 → −35 ~ −40° 連 6 張被擋，前輪卡 21.4° 衝出去）。0 = 不用
  jump_consist_max: 35    #   起步 speed.start_s 秒內和陀螺儀推算差超過這個（度）就算一致也不接受（11-23 193042 起步單線 −54 ~ −64° 被接受，前輪打到底 0.4 s 引發蛇行；只限起步，坡前急彎真的會跳 > 35°）
  jump_n: 6               #    最多連續忽略幾張（平地）
  jump_n_slope: 15        #    坡上（坡道是直的，可以忽略久一點）
  jump_off: 0.20          # 只剩一條線時偏移一張跳超過這個（m）也算看錯（212647 坡上單線左右認反，−19 → +26 cm）
  up_fwa: 25              # 上坡前輪最多打幾度（從置中算）（20 → 25）
  up_fwa_stuck: 16        #    上坡卡住加推力時最多打幾度（10 → 16：195951 坡上前輪被限在 10°，車撞左邊）
  diff_from: 25           # 前輪超過幾度才用後輪差速
  diff_gain: 0.8

speed:
  v_straight: 100         # 2. 大直線（兩條線、看得遠、又直）（75 → 100：11-19 使用者要求直線跑滿）
  v_mid: 66               # 直的但只看到一條線 / 看不遠（55 → 60）
  v_curve: 55             # 1. 彎道（51 → 55：11-22 使用者要求彎道至少 55%）（40 → 46 → 52 → 46：11-21 161139 右彎 52% 時 27% 的時間離中線 > 14 cm 壓線，46 是穩跑 4 圈的值）
  v_sat: 55               #    前輪快打到底（30 → 34 → 38 → 36 → 45 → 50 → 55：11-22 使用者要求彎道至少 55%）
  sev_low: 8              # 「彎的程度」（度）低於這個算直
  sev_high: 20            #    高於這個用 v_curve（18 → 20：晚一點降速）
  sev_sat: 30             #    高於這個用 v_sat（36 → 30）
  sev_head: 1.0           #    車頭和車道夾角（度）× 這個也算彎的程度（202536 夾角 −25° 還用 50% 衝出去撞柱）
  preview: 1.1            # 看前方多遠的彎提早減速（m）
  preview_per_v: 0.9      #    每 100% 速度多看幾 m（100% 時看 2.0 m，來得及漸進減速）
  straight_far: 2.0       # 看得到這麼遠才算大直線（m）
  accel: 40               # 每秒最多加速幾 %（50 → 40：出彎漸進加速）
  decel: 80               # 每秒最多減速幾 %（進彎、岔路口漸進減速）
  wheel_slew: 150         # 每個後輪指令每秒最多變幾 %（平地循線；差速、卡住推力也漸進。反打 / 坡道 / 虛線左轉不限）。0 = 關
  brake_dv: 35            # 一次要降超過這麼多才反打（20 → 35：一般進彎改成漸進減速，反打只留給緊急）
  brake_v: -10
  brake_s: 0.15
  start_v: 40             # 出發頭 start_s 秒最多
  start_s: 2.0
  start_boost: 6          # 起步時卡住加推力最多加到 start_v + 這個（12 → 6：平地花紋均勻會誤判卡住，起步衝太快進第一個彎）
  v_lost: 26              # 看不到線時
  lost_s: 1.0             # 看不到線多久停車（坡上 / 暗處 2.5 s）
  v_dark: 50              # （45 → 50：5 圈隧道 27.0–28.8 m 偏移 90 百分位 7.8–13.4 cm、41.3 m 隧道 10.1–16.0 cm，只加一階）
                          # 暗處（隧道）、隧道口（36 → 32 → 28：11-21 使用者要求進隧道再慢）
  tunnel_drop: 8          # 隧道口提早認：遠處亮度比過去 1 秒最大值低這麼多
  tunnel_far_max: 50      #    而且低於這個（161638 原本 < 44 才認，進去前 0.1 秒；這樣提早約 0.6 秒）

slope:
  pitch_n: 6              # 俯仰連續幾張才算
  up_pitch: 9             # 3. 上坡
  up_off_pitch: 6         #    上坡後要俯仰連續 up_off_n 張 < 這個才算到坡頂（165731 坡上顛簸一張 < 9 就被當坡頂，停在坡上）
  up_off_n: 5
  up_v: 73                # 55 → 62：200621 坡中間 55% 停住；62 → 66：152948 坡中間爬到幾乎停住
  up_accel: 30            #    上坡速度每秒最多加幾 %（漸進，給車頭回正時間）
  up_v0: 40               #    上坡漸進加速的起點（從這個速度往上加）
  up_accel_min: 0.4       #    完全不居中時加速度只剩 up_accel × 這個
  up_min_v: 50            #    完全不居中時上坡速度上限；完全居中時可到 up_cap（中間照居中程度比例）
  up_stuck_min: 70        #    卡住時（卡住推力 ≥ up_align_boost）上限至少這個，推得動
  center_off: 0.20        # 居中程度：偏移 0 → 1、偏移 ≥ 這個（m）→ 0
  center_deg: 25          #    車頭和車道夾角 0 → 1、≥ 這個（度）→ 0（兩者相乘）
  stuck_m: 1.5            # 畫面變化低於這個開始算卡住
  stuck_m_up: 2.5         # 上坡時（坡上爬很慢畫面變化也有 2 左右）
  start_stuck_m: 0.8      # 起步時畫面變化低於這個才算卡住
  moving_m: 3.0           # 高於這個才算動起來
  stuck_s: 0.4
  boost_per_s: 40         # 卡住時每秒加推力
  up_boost_per_s: 80      #    坡上卡住每秒加推力（40 → 80：185357 坡上停 1.7 秒才推得動）
  boost_max: 40
  turn_stuck_fwa: 20      # 平地：前輪打超過這麼多度（從置中算）
  turn_stuck_rate: 3      #    車頭轉速卻低於這個（度/秒）= 真的卡住，可以加推力（取消內外輪差速）
  turn_stuck_cap: 55      #    最多到這個 %
  up_cap: 90              # 上坡加推力後最多
  up_align_deg: 15        # 上坡時車頭和車道差超過這個（或看不到線）= 還沒對正：前輪不限制
  up_align_v: 50          #    還沒對正時速度（含卡住推力）最多這個 %
  up_align_boost: 15      #    對正中卡住推力超過這個 = 先爬上去：前輪收到 up_fwa、速度放到 up_align_stuck_v（205751 坡底卡死）
  up_align_stuck_v: 80
  top_v: 45               # 上坡結束（到坡頂）後 top_s 秒內最多這個速度，推力歸零
  top_s: 1.0
  crest_n: 3              # 上坡中俯仰連續幾張 < up_pitch = 正在過坡頂：降到 top_v、推力歸零、兩輪等速
  crest_min_s: 2.0        #    上坡開始這麼多秒後才算（坡道中段顛簸不算：165731 上坡 1.3 s 時俯仰 13 → 5 跳動）
  post_crest_v0: 30       # 坡頂後先降到這個速度（%），居中時才每秒加 post_crest_accel，到虛線 / 下坡前（使用者建議緩慢提速）
  post_crest_accel: 8
  post_crest_off: 0.08     #    居中 = 兩條線、離中線 ≤ 這個（m）
  exit_hold_s: 0.1        # 平台出口：虛線左轉完這麼多秒後到下坡前，陀螺儀維持車道方向（下層賽道的線會讓影像亂跳）
                          #   （1.0 → 0.1：11-22 191603 轉完 0.1 s 影像就看錯左打，1 s 內車頭多轉 +41°）
  exit_dpsi: 85           #    出口方向 = 左轉開始時車頭角 + 這個（75 → 85：11-22 193803 / 193919 車頭 +85~+90° 時偏移穩定、+74~+77° 時一路往右偏到 +30 cm，騎在虛線上下坡）
  exit_ref_tol: 10        #    影像只能在地圖方向 ±這個度內微調
  exit_ref_k: 0.3         #    兩條線的方向每張修正出口方向的比例（0.15 → 0.3：215150 第 2 圈兩條線一直說車道在右 −5 ~ −11°，修太慢，下坡從左邊摔下去）
  exit_ref_hd: 12         #    方向 < 這個才拿來修（10 → 12）
  exit_off_max: 8         #    左右偏移修正最多幾度（201101 第 2 圈單線偏移修到 +17.7°，車頭被帶到 +105.7°）
  exit_stable_n: 5        #    單線偏移連續這麼多張都很穩，也拿來修左右（214145 只看得到左實線，偏左 −5 ~ −12 cm 沒修，撞左邊條）
  exit_stable_tol: 0.05   #    「很穩」= 這幾張偏移最大最小差 < 這個（m）
  exit_wrong_off: 0.25    #    看得到虛線、中線在左邊 ≥ 這個（m）連續 exit_wrong_n 張 = 跑到虛線右邊
  exit_wrong_n: 3
  exit_wrong_max: 15      #    這時往左修最多幾度（204034 偏 +46~+62 cm 被限 8°，開到平台右緣掉下去）
  exit_wrong_tol: 20      #    這時車頭最多到出口方向 + 這個（不要像 201101 一樣一路帶到 +105° 下坡）
  exit_gain: 1.2           #    前輪 = −這個 × (要轉的角度)
  exit_k_off: 1.0          #    兩條線時的左右偏移修正
  exit_fwa: 20             #    這段前輪最多打幾度（從置中算）
  crest_zone_s: 3.0        # 坡上到坡頂後幾秒內：單線偏移跳一個車道寬 = 左右認反，自動修正
  flip_jump: 0.2
  crest_s: 3.0            # 坡頂邊緣：上完坡這麼多秒內（或在高處俯仰 ≥ crest_pitch）卡住也可以加推力
  crest_pitch: 2.0
  crest_still_m: 0.9      #    坡頂要畫面變化低於這個（真的卡住 0.4–0.6，平台上正常跑 1.6–3.8）
  crest_still_s: 0.5      #    連續這麼久才算卡住
  crest_stuck_cap: 70     #    最多推到這個 %（162248 坡頂 38–42% 推不上去）
  ramp_learn_pitch: 12    # 坡道方向：俯仰 ≥ 這個持續 ramp_learn_s 秒、兩條線路寬合理才量
  ramp_learn_s: 0.6       #    （0.3 時坡道剛開始那段方向偏右 ~10°）
  ramp_k_off: 3.0         # 坡上左右偏移修正（一般 k_off 1.0；坡上前輪抓不住要修大一點：180923 偏 10 cm 只修 4°）
  ramp_gain: 1.4          # 坡上前輪修正放大（11-19 地上實測：後輪左右差 20% 跑 0.8 s 車頭只轉 2.5°，差速幾乎轉不動車，要靠前輪）
  ramp_ki: 2.0            # 坡上積分修正：每秒累加「誤差 × 這個」度
  ramp_i_max: 15          #    最多累加幾度
  ramp_kp: 0.8            # 坡上後輪差速：想往左轉 1° → 右輪多 / 左輪少這麼多 %
  ramp_ki: 1.5            #    積分：每秒累加「想轉的度數 × 這個」%（一直偏同一邊就越修越多）
  ramp_i_max: 15          #    積分最多幾 %
  ramp_k_rate: 1.0        #    車頭每秒轉 1° → 差速反向修這麼多 %（坡道是直的，車頭不該轉）
  ramp_diff_max: 20       #    差速最多幾 %
  ramp_early: true        # 坡上穩定後量不到坡道方向（只看到一條線）時，用坡底剛對正時量的（124429 沒量到、坡頂左邊衝出去）
  ramp_early_hd: 6        #   備用只收車道方向 ≤ 這個度數的畫面（車子已經對正）
  ramp_foot_kd: 0.3       # 坡底還沒有坡道方向時的車頭轉速阻尼（前輪 += 這個 × 轉速 °/s）：135702 坡前彎沒轉完上坡，右邊衝出去
  ramp_learn_hd: 8        # 量坡道方向只收影像車道方向 ≤ 這個度數的畫面（173958 坡道上段影像 −14 ~ −18° 把坡道方向拉偏 ~15°）
  ramp_learn_tol: 8       #   已經有坡道方向時，和它差超過這個度數的不收
  ramp_n: 15              # 坡道方向 = 最近幾張「車頭角 + 車道方向」的中位數
  ramp_vis_w: 0.5         # 坡上前輪角 = (1 − 這個)·陀螺儀維持坡道方向 + 這個·視覺（車道方向 + 偏移）
  ramp_vis_hd: 10         # 坡上影像車道方向和陀螺儀差超過這個（度）就不採用影像方向（173958 坡頂影像 −14 ~ −43°、陀螺儀 0~7°，右邊衝出去）
  ramp_vis_max: 15        # 視覺那一半最多幾度
  ramp_top_s: 1.5         # 到坡頂後再維持坡道方向幾秒（0.4 → 1.5：190254 坡頂影像認錯邊，車壓上平台左邊緣；這段只信兩條線）
  moving_n: 4             # 畫面變化連續幾張 ≥ moving_m 才算真的動起來
  foot_pitch: 6           # 俯仰 ≥ 6°（坡底、開始上坡）也可以加推力（起步加速時 IMU 會讀到 +4°）
  down_pitch: 7           # 5. 下坡（9 → 7：坡頂就開始反打，不要先衝下去）
  down_n: 4               #    俯仰連續幾張才算下坡
  down_brake: -25         #    一路反打後輪：畫面變化 ≥ down_fast_m 打到這麼多（−10 → −25：152406 第二圈坡上太快甩出線）
  down_brake_min: -8      #    畫面變化剛超過 down_push_m 時反打這麼多，兩者之間照比例
  down_fast_m: 7.0
  down_push_m: 2.5        #    太慢（< down_push_m）用 down_v 推
  down_coast: true        # 下坡滑行 + 適時輕反打（11-21 使用者方案）；false = 舊的一路反打 / 太慢推
  down_coast_m: 4.0       #    畫面變化低於這個 = 夠慢，滑行（馬達 0）；高於就開始反打 down_brake_min，到 down_fast_m 打到 down_brake
  down_smooth: 0.6        #    反打量低通（每張留 60%）：連續變化、不要開關式切換（152406 來回切會甩）
  down_v: 35
  down_stuck_v: 50        #    下坡卡住推到這麼多（70 → 50：160642 坡底推到 70% 甩出去）
  down_stuck_pitch: 12    #    俯仰 ≤ −這個（還在陡坡上）才算下坡卡住
  down_stuck_m: 0.8       #    滑行模式：畫面變化 < 這個才算下坡卡住（滑行本來 1.1–2.7；173105 被當卡住推到 55%）
  down_kp: 1.0            # 下坡後輪差速：想往左 1° → 左輪多反打 / 右輪少反打這麼多 %（183932 下坡口前輪左打 30° 還往右壓線）
  down_diff_max: 5        #    差速最多幾 %（15 → 5：164610 下坡左 −37 / 右 −7 差 30%，車頭 +84°/s 往左甩）
  down_fwa: 20            # 下坡前輪從置中算最多 ±這麼多度（坡上視覺方向亂跳，前輪跟著打滿 ±44° 造成左右甩）
  down_img_w: 0.0         # 下坡前輪：影像比重（其餘照出口方向維持）。0.5 → 0：220412 第 4 圈影像把坡下平地的線當右線，往左帶摔下去
  down_kd: 0.2            # 下坡陀螺儀阻尼：前輪 += 這個 × 車頭轉速（°/s，左正）；+50°/s 往左甩 → 前輪往右 10°
  down_v_ms: 0.8          #    下坡左右偏移修正用的速度（m/s）
  down_foot_v: 20         # 下坡下半段（俯仰比 −down_foot_pitch 緩）、畫面變化 < down_foot_m（快停了）時輕推這麼多 %，不要停在坡底
  down_foot_pitch: 14     #   （11-23 113124 兩次坡底俯仰 −13 ~ −8° 還在滑行，畫面變化 0.65–1.9，停頓 0.4–0.7 s）。0 = 不用
  down_foot_m: 2.0
  bottom_v: 45            # （35 → 45：11-23 114625 三次坡底前輪打滿 44°、內輪 7%，畫面變化 0.7–2.5 爬 0.9–1.3 s 才轉完）
                          # 下坡結束（到坡底）後 bottom_s 秒內最多這個速度，推力歸零
  bottom_s: 0.8
  flat_pitch: 6           # |俯仰| ≥ 這個不用後輪差速

junction:
  enable: true            # 4. 遇見虛線左轉
  dash_min: 2             # 一張畫面至少幾塊虛線排成橫線才算「看到」（追蹤用；確認還要下面兩個條件）
  dash_hits: 4            # 追蹤：距離一致（隨車速靠近）的畫面累計幾張才確認是虛線（取代「連續 3 張 ≥ 3 塊」：155804 塊數 2/3 跳動，一直湊不到連續 3 張，漏判）
  dash_hits3: 2           #    其中至少幾張是 ≥ 3 塊
  dash_trk_tol: 0.10      #    這張的距離和預測（上次距離 − 靠近速度 × 時間）差幾 m 以內才算同一條虛線（雜物、反光的距離會亂跳）
  dash_trk_rel: 0.15      #    再加上距離 × 這個（遠的量得比較不準）
  dash_x_max: 2.0         #    超過這個距離的不追
  go_x: 0.78              # 虛線到車頭前（鏡頭算起）這麼近才開始左轉（0.65 → 0.78：18:52 鏡頭重校正後，左轉完車子都偏到車道右邊 +20~+29 cm、
                          #   壓平台右邊線（194359 / 194823 / 195325 / 195351）；重校正前左轉完在 −7~−15 cm）
  dash_lost_s: 0.4        # 等左轉時虛線超過這麼久沒再出現 = 看錯，取消左轉
  dash_near_m: 0.15       #    虛線不見前最後距離 ≤ go_x + 這個 = 跑到車頭下了，直接轉（不是看錯）
  dash_after_top: 1.2     # 上完坡（坡頂）後這麼多秒內不認虛線
  dash_need_elevated: true  # 要上過坡、在高處才認虛線（211032 / 211121 出隧道後平地誤判左轉；一定從大直線出發，平台出發要改 false）
  max_pitch: 5            # 俯仰 ±5° 內才看（坡上不看）
  fwa: -40
  v: 35
  yaw: 58                 # 車頭左轉這麼多度就回到循線（回正後還會再滑約 20°）
  max_s: 2.0
  time_s: 0.95            # 沒有 IMU 時打多久
  post_turn_s: 1.5        # 左轉結束後幾秒內不用橫過前方的線
  cooldown_s: 10          # 轉完幾秒內不再認
  dash_side: right        # 虛線左轉完：虛線在車子右邊 = 車走虛線左側（11-21 使用者要求；left = 走虛線右側）
  v_after: 40             # 虛線左轉完到下坡前（最多 after_s 秒）最高速度（11-21 使用者要求這段放慢）
  after_s: 8
  fork_n: 2               # Y 字岔路（V 形分隔線）連續幾張才算
  fork_hold_s: 1.5        # 看不到分隔線後再維持選好的那一邊幾秒
  v_fork: 55              # 岔路口目標速度（50 → 55：11-22 使用者要求）（看到 V 分隔線開始漸進減速）
  fork_cross_m: 0.08      # 照地圖走、但 V 尖端在要走那一側超過這個（m）= 要橫切過尖端
  v_cross: 35             #    橫切時速度上限（%）（11-22 195822 第 3 圈 55% 硬切甩出去）
  cross_s: 1.5            #    維持幾秒
  fork_tip_min: 0.0       # 使用者規則（11-19）：尖端在車子右邊就靠左、在左邊就靠右，不設門檻（原 0.15 m 內一律走右）
  fork_default: right     # 尖端剛好在正中間（0 cm）時走這邊

safety:                   # 保護機制（11-20：213809 在坡道上誤判虛線左轉，摔下坡道）
  fall_pitch: 30          # 1. 車身俯仰超過 ±這個（度）= 摔落／翻車，馬上停（坡道最多約 ±22°）
  elevated_s: 15          # 上完坡後最多這麼久還算在高處（之後沒偵測到下坡也當回到地面）
  elevated_lost_s: 0.5    # 2. 在高處（坡道、平台）找不到線超過這麼久就停車（地面上是 1 s 慢慢找）
  turn_drop_pitch: 6      # 3. 虛線左轉時俯仰低於 −這個 = 轉出平台邊緣往下掉，馬上停（正常左轉最低 −2.3 ~ −4.5°；213809 摔下去時 −7 → −9°）
  turn_wheel_max: 45      # 4. 虛線左轉時外側輪最多這個 %（原本到 64%，轉太猛）
  edge_off0: 0.11         # 5. 靠邊漸進減速：離中線超過這個（m）開始降速
  edge_off: 0.18          #    到這個降到 edge_v（高處 edge_v_high）（0.20 → 0.18；車道寬 0.53，離中線約 0.14 輪子就壓線）
  edge_v: 55              #    （45 → 55：11-22 使用者要求彎道至少 55%；平地吃線可接受。高處仍用 edge_v_high）
  edge_v_high: 40
  elevated_wheel_max: 45  #    高處、虛線左轉完到下坡前：急彎差速時外側輪最多這個 %（161638 衝到 67%）
  elevated_v: 44          # 6. 在高處（上完坡到下坡前：平台）整段最高速度（平台出口就是下坡，先慢下來）

map:                      # 背地圖（11-21 使用者要求：純影像誤判太多；一定從起點或起點後的大直線出發）
  enable: true
  use: true               # false = 只定位、不用地圖做決定（看 log 用）
  start_anywhere: true    # 任何地方出發：定位從整圈開始找；經過第一個上坡起點（對到地圖）之前完全照影像跑
  up_anchor_pitch: 12     # 上坡起點要俯仰到這個才拿來定位（203956 起步 +9.2° 被當上坡，定位錯 18 m、岔路 V 被忽略；真坡 ≥ 15.6°）
  up_anchor_m: 1.5        #    上坡開始後這麼多 m 內沒到就不採用
  file: track_map.json    # tools/build_map.py 用多圈紀錄建（一圈從上坡開始算 s = 0）
  win_m: 1.5              # 定位：比對最近幾 m 的車頭變化
  psi_sigma: 15           #    車頭變化的容許誤差（°）
  like_pow: 0.15          #    每張畫面修正的力道
  odo_rel: 0.06           #    行駛距離估計的誤差比例
  anchor_gate: 6.0        #    已確定位置時，事件（上坡、下坡、虛線）離地圖超過這麼多 m = 誤觸發，不理
  ok_sd: 0.5              #    位置誤差 ≤ 這個（m）才用地圖做決定
  ok_mass: 0.8
  fork_before: 1.5        # 岔路：地圖岔路前後幾 m 內走指定那邊（其他地方看到 V 不理）
  fork_after: 1.5
  fork_lm: true           # 地圖還不能用時，用 V 前面看過的地標認岔路（取代影像尖端規則；11-22 144642 尖端偏 4 cm 判反）
  fork_lm_dark_m: 6.0     #    V 前這麼多 m 內看過隧道 = 前面有隧道的岔路（30.4 m）；沒有 = 39.8 m
  fork_lm_v_m: 4.0        #    V 前這麼多 m 內剛過另一個 V = 同一個岔路口，照剛才那邊
  dash_before: 2.5        # 虛線：只在地圖虛線位置前 dash_before ~ 後 dash_after m 內認虛線（放寬：定位可能差 2 m）
  dash_after: 3.0
  dash_late: 0.6          #    過了地圖虛線位置這麼多 m 影像還沒觸發 → 照地圖左轉
  dash_fallback: false    #    影像沒看到就照地圖左轉：關閉（191914 / 192035 定位跑前面，還沒到虛線就左轉）
  guard:                  # 地圖方向保護區段（m）：前輪不准往地圖彎的反方向打，至少打 guard_ff × 彎度
    - [11.6, 13.2]        #    下坡底剛下來那段（173105 影像選錯線往左衝出去）；17.0 → 13.2：後段車子轉過頭要往左修（195351 被擋住壓過右線）
  guard_ff: 0.0           #    0 = 只禁止往反方向打，不強迫打多少（0.35 時 195351 坡底右彎被強迫右打 +12~+15°，車子已經偏內側還壓過右線）
  guard_block_k: 1.0      #    影像要往反方向打被擋時，改打 這個 × 地圖彎度需要的角度（211827 被擋成置中 1 s 沒轉、衝出右線；只在被擋時用，不影響 195351 那種情況）
  boost_off: 0.08         # 地圖加速的條件：影像兩條線、離中線 ≤ 這個（m）、車頭 ≤ boost_head 度（影像為主，地圖只輔助）
  boost_head: 8
  boost_one_off: 0.06     #    只看到一條線：離中線 ≤ 這個、車頭 ≤ boost_one_head 也可以加速，但最多 boost_one_v
  boost_one_head: 6
  boost_one_v: 80
  ramp_approach: 0.5      # 上坡前這麼多 m 地圖不減速（3.0 → 0.5：3 m 剛好是坡前急彎，不減速出彎被甩到左邊才上坡）
  pre_ramp: [43.5, 47.3]  # 坡前右急彎（地圖 m）：限速 pre_ramp_v，出彎在中間再上坡（47.9 → 47.3：最後一段加速、俯仰 ≥ 6° 也放開）
  pre_ramp_v: 50           # （55 → 50：11-23 135702 坡前彎出來前輪還 +40° 就上坡，從坡道右邊衝出去；55 時打到底 4–6%）
                           # （50 → 55：11-23 110643 一圈 51% 偏移 90 百分位 9.9 cm、前輪打到底 2.6%、前輪 90 百分位 31.5°）
                           # （45 → 50：11-22 221554 兩圈 45% 偏移 90 百分位 12.2 cm、前輪打到底 4.0%）
                           # （40 → 45：11-22 220412 三圈 40% 偏移 90 百分位 10.7 cm、前輪打到底 3.8%，這段一圈 7.1 s）
                           # （32 → 40：11-22 201101 用 32% 偏移 90 百分位 7.9 cm、前輪打到底 0%；這段一圈花 9.2 s，佔 15%）
  slow_zones:             # 地圖沒記到的暗處 / 隧道口 [起點 m, 終點 m, 速度 %]：前方看到就漸進降
    - [19.8, 21.6, 70]    #    （65 → 70：11-23 111940 三圈暗處 20.2–22.0 m 偏移最大 9.7 / 10.1 / 10.0 cm、前輪最大 17°、打到底 0）
                          #    （60 → 65：11-23 110643 暗處段 60% 偏移 90 百分位 7.2 cm、前輪 90 百分位 14°、打到底 0%）
                          #    （45 → 60：11-22 220412 / 221554 共 5 圈，暗處維持方向段 20.2–22.0 m 偏移 90 百分位 5.4–6.1 cm、最大 8.6 cm）
                          #    11-22 194748 兩圈 s ≈ 20.3 都出現隧道口；第一圈 44% 沒事，第二圈 59.6% 進去看錯衝出去
  slow_k: 25              #    離區段每 1 m 可以多 25%（100% 約在 2.2 m 前開始降，每秒降不到 decel）
  hold_zones:             # 暗處 / 隧道（地圖上是直的）[起點 m, 終點 m]：陀螺儀維持進去前的車道方向，影像只小幅修
    - [20.2, 22.0]        #    11-22 202211 暗處 20.9 m 影像亂跳，前輪 −27 ~ −31° 撞到東西
    - [27.0, 28.8]        #    11-22 202516 隧道 27.5 m 單線偏移跳 +33 ~ +38 cm，前輪 −18 ~ −29° 掉出邊緣
  fork_hold_zones:        # 岔路區 [起點 m, 終點 m]：和 hold_zones 一樣維持方向（11-23 113124 岔路偏移 ±21–27 cm、前輪 ±20° 來回打；
    - [29.0, 33.2]        #    地圖 29–33 m、37.5–41 m 車頭方向 ±4°，走的那邊是直的）；33.6 m 開始髮夾彎 2、41.0 m 開始往左彎
    - [38.4, 40.8]        #    11-23 11:55 使用者要求實測（開迴路回放 14 次通過 5 好 5 壞，無法證明）
  fork_hold_after_s: 5.0  # 地圖要連續定位這麼多秒以上才用岔路維持方向（115540 在 V 上才定位，馬上維持方向走錯邊）
  fork_hold_ki: 2.0       # 岔路維持方向的積分：每秒加「偏差度數 × 這個」度（122950 比例控制停在偏 3.6° 直走，3 m 偏 50 cm）
  fork_hold_i_max: 6.0    #   積分最多幾度
  fork_hold_i_rate: 3.0   #   車頭轉速 < 這個（°/s）才累積（剛進岔路還在轉時不累積，免得過衝）
  fork_hold_v: 75         # （65 → 75：使用者要求岔路至少 70%；121713 上限 65 時實際 55–64%，上限要比目標高）
                          # （60 → 65：11-23 120220 岔路區維持方向中 30.4 偏移 90 百分位 6.2 cm、前輪 7.8°；39.8 14.5 cm、11.8°）
                          # 岔路區維持方向中的岔路限速（junction.v_fork 55 → 這段 60，只加一階）
  fork_hold_lw: [0.42, 0.58]   #  岔路區兩條線路寬在這個範圍內才拿來修左右（分岔處配到 V 外側線 0.6–0.72 m）
  hold_hist_s: 0.8        #    進去前幾秒內「兩條線、方向 < 12°」的畫面取中位數當方向
  hold_off_max: 6         #    兩條線時左右修正最多幾度
  hold_hd_max: 15         #    兩條線、方向 < 這個的畫面拿來修正維持方向（205458 隧道裡兩條線說車道在右 −8.8 / −13.6° 沒被採用，撞左邊）
  hold_ref_k: 0.0         #    每張修正比例（0.3 → 0：211945 隧道口配錯的兩條線把方向帶左 4°、前輪往左 −6 ~ −13°，反而更糟；先關）
  hold_ref_tol: 10        #    最多離進去時的方向幾度
  hold_jump: 0.12         #    兩條線偏移和上一張差超過這個（m）= 配錯，不用（211945 隧道口 −13.9 → +16.1 cm 把方向帶左，撞左邊）
  hold_vis: true          #    地圖還沒定位（第一圈）時，影像看到隧道口 / 暗處也維持方向（212023 第一圈沒維持，單線亂跳往左撞隧道）
  hold_vis_s: 0.8         #    最後一次看到隧道口 / 暗處後再維持這麼多秒
  hold_vis_curve_hd: 15   #    兩條線方向超過這個度數、連續 hold_vis_curve_n 張 = 彎道，hold_vis_curve_s 秒內不用影像觸發的維持方向
  hold_vis_curve_n: 2     #    （11-23 105609 / 105632 右彎被誤判成隧道口，兩條線 −14 ~ −25° 前輪還被拉回往左）
  hold_vis_curve_s: 1.5
  hold_map_psi: false     #    維持方向要不要加地圖方向變化（213131 地圖這段雜訊往左 3.9°，車道其實是直的 ±2°，撞起點柱子 → 不加）
  hold_kd: 0.2            #    轉速阻尼：前輪 += 這個 × 車頭轉速（°/s，左正）（211945 進隧道車頭 0.6 s 左轉 15° 衝過頭）
  down_follow_map: false  # 下坡方向 = 出口方向 + 地圖車頭變化。先關：205458 原本歸因「坡底撞柱子」是錯的（坡底停住是反打煞車，
                          #   柱子其實在暗處出口 22 m），剩下的證據只有坡底單線偏 −25 cm，不夠

  hold_fwa: 15            #    前輪最多打幾度（從置中算）
  hold_gain: 1.2
  curve_v:                # 指定彎的彎道速度 [起點 m, 終點 m, 速度 %]：只放已證明轉得過去的彎
    - [12.5, 16.0, 70]    #    （16.0–17.5 拆出去：11-23 120220 出口 16.7–17.1 m 用 70% 衝出左邊緣掉下去；三趟出口偏移 90 百分位 18–23 cm）
    - [16.0, 17.5, 60]    #    （65 → 70：11-22 201101 用 65% 偏移 90 百分位 12.9 cm、前輪打到底 0%）
                          #    11.9–17.0 m 右緩彎（最彎 41°/m，R ≈ 1.4 m）：65% 側向 0.75 m/s²，已證明 0.90–0.94 m/s² 沒問題
    - [23.4, 26.7, 70]    #    （65 → 70：11-22 220412 / 221554 共 5 圈 65% 偏移 90 百分位 13.1 cm、前輪打到底 3.8%）
                          #    （60 → 65：11-22 201101 用 60% 偏移 90 百分位 11.3 cm、前輪打到底 4%）
                          #    23.9–26.2 m 髮夾彎：11-22 195822 用 55% 偏移 90 百分位 6.2 cm、前輪打到底 3% → 先加一階到 60（33.6–36.7 m 打到底 12%，維持 55）
                          #    髮夾彎 23.9–26.2 / 33.6–36.7 m（R 0.6–0.7 m）65% 要 1.5–1.7 m/s²，沒證據 → 不放，維持 55
  preview: 1.0            # 速度：看前方 preview + preview_per_v × 速度 m 內最彎的地方
  preview_per_v: 1.2
  behind: 0.3
  k_straight: 12          #    最彎 ≤ 這個（°/m）= 直線
  k_curve: 45             #    ≥ 這個 = 彎道
  k_sat: 75               #    ≥ 這個 = 急彎
  v_straight: 100
  v_curve: 55             # （51 → 55：11-22 使用者要求彎道至少 55%）
  v_sat: 55               # （45 → 50 → 55：11-22 使用者要求彎道至少 55%）

imu:
  enable: true
  bus: 1
  addr: 0x68
  forward: "+x"

link:
  port: /dev/ttyTHS1
  baud: 115200
  hz: 20
  sta_timeout: 0.5

web:
  enable: true
  host: 127.0.0.1
  port: 8001
  public_port: 8000
  record: true
  full_mps: 1.57      # 100% 實測車速（11-21 大直線 261 rpm），網頁換算 m/s 用

log:
  dir: ../logs
  stream_hz: 10

obstacle:                 # 前車偵測（11-23：跟車、太近就停，只用鏡頭；obstacle.py）
  enable: false           # 11-23 14:00 使用者：不要車子防撞（程式保留，要用改 true）
  act: false              # false = 只記錄（CSV obs = 確認後距離、obs_raw = 單張），不減速；驗證過再開
  win: 6                  # 連續確認：最近 win 張裡至少 need 張偵測到、距離差 ≤ tol m
  need: 4
  tol: 0.15
  skip_zones:             # 不偵測的地圖區段 [起點 m, 終點 m]（可跨圈）：坡前 → 上坡 → 坡頂 → 平台 → 下坡
    - [46.5, 10.5]        #   沒車影片連續確認誤判 34 次全在這段；平地 0 次（131445 / 121713 / 114625）
  max_pitch: 5            # 地圖還沒定位時：俯仰超過這個、坡上、高處都不偵測
  stop_d: 0.35            # 跟車（act true 才作用）：這個距離以內停車
  slow_d: 1.2             #   這個距離以內照距離線性限速
  follow_v: 60            #   跟車時最多這個 %
