# 循跡主程式的所有可調參數。標「要量」的請量實車後填入。

camera:
  device: 0               # /dev/video0
  width: 640
  height: 480
  fps: 30
  # 啟動時用 v4l2-ctl 設定（先 `v4l2-ctl -d /dev/video0 --list-ctrls` 看實際名稱），留空就不設
  v4l2_ctrls:
    white_balance_automatic: 1
    auto_exposure: 1
    focus_automatic_continuous: 0
    brightness: 0
    contrast: 1
    saturation: 64
    hue: 0
    gamma: 215
    power_line_frequency: 1
    sharpness: 2
    backlight_compensation: 0
    exposure_time_absolute: 166
    focus_absolute: 0

geometry:                 # 鏡頭與車子的幾何，用來把畫面換成公尺
  cam_height: 0.15        # 要量：鏡頭鏡片離地高度 m
  hfov: 70.0              # 鏡頭水平視角（度），查規格或量
  cam_to_rear_axle: 0.12  # 要量：鏡頭在後輪軸前方多少 m（在後輪軸後方就填負值）
  wheelbase: 0.28         # 要量：前後輪軸距 L（m）
  track_width: 0.16       # 要量：兩後輪中心距 W（m），差速用
  lane_width: 0.54        # 要量：兩條白線中心距（m）；只看到一條線時用來推中線
  car_width: 0.30
 
vision:
  baseline: ../baseline.json   # lane_view_check.py --save-baseline 產生；提供地平線位置
  roi_top: 0.32           # null = 用基準檔的設定
  roi_bottom: 0.77        # 畫面下緣拍到車身時調小，例如 0.85
  thresh: 0               # 0 = Otsu 自動門檻
  min_thresh: 60
  smooth: 0.5             # 中線擬合係數的平滑（0 = 不平滑，越大越穩但越慢）
  # 以下與 lane_view_check.py 相同，通常不用改
  curve_px: 2.5
  slope_deg: 3.0
  min_span: 0.3
  cutoff_w: 0.2
  nwin: 14
  margin: 18
  minpix: 6

control:
  lookahead: 0.45         # Pure Pursuit 前視距離 Ld（m），從約 1.5 倍車長開始試；太小會搖、太大會切內線
  lookahead_per_speed: 0.0  # Ld 隨速度增加：Ld = lookahead + 這個值 × 速度%/100
  fwa_limit: 44           # 前輪轉角上限（度）；韌體行程約 -35 ~ +33 度
  fwa_trim: 0             # 前輪置中修正（度）
  v_max: 30               # 最高速度 %（先低速）
  v_min: 24               # 最低速度 %（低於這個馬達可能不轉）
  k_curv: 0.25            # 彎越急越慢：v = v_max × (1 - k_curv × |曲率 1/m|)
  uphill_boost: 8         # 前方上坡時加多少 %
  downhill_factor: 0.6    # 前方下坡 / 坡頂時速度乘上這個值
  slope_memory: 3.0       # 坡頂 / 坡底判斷的時間窗（s），見 controller.py
  accel_per_s: 60         # 每秒最多加速多少 %（避免暴衝）
  differential: true     # 後輪差速；只有一顆馬達出力時先關掉
  diff_gain: 0.8
  diff_from: 25
  stall:
    enable: true
    boost_per_s: 25
    boost_max: 45
    release: 1.4
    release_s: 1.0
    drop_per_s: 15
    floor_ratio: 0.7
    floor_s: 3.0
  hilltop:
    enable: true
    arm_boost: 20
    time_s: 8.0
    v_max: 32
    fast_motion: 3.0
  corner:
    enable: true
    out_offset: 0.10
    trigger: 0.30
    wheelbase: 1.26
  k_i: 60
  i_leak_s: 3.0
  i_max: 15

safety:
  lost_timeout: 0.3       # 找不到線超過幾秒就停車
  lost_speed_factor: 0.5  # 找不到線期間速度乘上這個值，維持最後轉角
  sta_timeout: 0.5        # 超過幾秒沒收到 STA 就停車
  idle_steer: true        # 待命時前輪也跟著辨識結果轉（架高測試用），速度維持 0

link:
  port: /dev/ttyTHS1
  baud: 115200
  hz: 20

debug:
  stream: true            # 瀏覽器看除錯畫面 http://<orin-ip>:8080，比賽時關掉
  port: 8080
  stream_hz: 10
  log_dir: ../logs        # 每次執行寫一個 CSV
